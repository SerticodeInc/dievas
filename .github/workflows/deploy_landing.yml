name: Deploy — Landing

# Build the Jaspr static site and upload it to Cloudflare Workers.
# Manual fallback only. Cloudflare Git integration deploys master automatically.

on:
    workflow_dispatch:
        inputs:
            target:
                description: Site to deploy
                type: choice
                options: [landing, documentation]
                default: landing
            reason:
                description: "Reason for manual deploy (optional)"
                required: false
                default: "Manual trigger"

concurrency:
    group: deploy-${{ inputs.target || 'landing' }}
    cancel-in-progress: true

jobs:
    deploy:
        if: inputs.target != 'documentation'
        name: Deploy to Cloudflare Workers
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7

            - uses: dart-lang/setup-dart@v1
              with:
                  sdk: "3.13.2"

            - uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: landing/package-lock.json

            - name: Deploy landing
              run: npx wrangler@4 deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    documentation:
        if: inputs.target == 'documentation'
        uses: ./.github/workflows/documentation.yml
        with:
            deploy: true
        secrets: inherit
