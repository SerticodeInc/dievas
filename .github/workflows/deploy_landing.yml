name: Deploy — Landing

# Build the Jaspr static site and upload it to Cloudflare Workers.
# Manual fallback only. Cloudflare Git integration deploys master automatically.
# Required secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit),
# CLOUDFLARE_ACCOUNT_ID. Optional: DISCORD_HERMODR_WEBHOOK.

on:
    workflow_dispatch:
        inputs:
            reason:
                description: "Reason for manual deploy (optional)"
                required: false
                default: "Manual trigger"

concurrency:
    group: deploy-landing
    cancel-in-progress: true

jobs:
    deploy:
        name: Deploy to Cloudflare Workers
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7

            - uses: dart-lang/setup-dart@v1
              with:
                  sdk: '3.13.2'

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: landing/package-lock.json

            - name: Build static landing page
              run: bash landing/tool/build_cloudflare.sh

            - name: Deploy landing
              run: npx wrangler@4 deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Notify Discord — success
              if: success() && vars.DISCORD_NOTIFICATIONS_ENABLED != 'false'
              run: |
                  TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                  RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                  SHORT_SHA="${{ github.sha }}"
                  SHORT_SHA="${SHORT_SHA:0:7}"

                  jq -n \
                      --arg run_url "$RUN_URL" \
                      --arg commit_url "$COMMIT_URL" \
                      --arg sha "$SHORT_SHA" \
                      --arg msg "${{ github.event.head_commit.message || inputs.reason }}" \
                      --arg author "${{ github.event.head_commit.author.name || github.actor }}" \
                      --arg timestamp "$TIMESTAMP" \
                      '{
                        username: "Hermóðr 🌑",
                        embeds: [{
                          title: "✅ dievas-landing deployed",
                          color: 3066993,
                          fields: [
                            { name: "📦 Commit", value: "[`\($sha)`](\($commit_url)) — \($msg)", inline: false },
                            { name: "👤 Author", value: $author, inline: true },
                            { name: "🔗 Run", value: "[View](\($run_url))", inline: true }
                          ],
                          footer: { text: "Dievas CI/CD • Cloudflare Workers • dievas.serticode.com" },
                          timestamp: $timestamp
                        }]
                      }' > payload.json

                  curl -s -o /dev/null -w "%{http_code}" \
                      -X POST "${{ secrets.DISCORD_HERMODR_WEBHOOK }}" \
                      -H "Content-Type: application/json" \
                      -d @payload.json
              continue-on-error: true

            - name: Notify Discord — failure
              if: failure() && vars.DISCORD_NOTIFICATIONS_ENABLED != 'false'
              run: |
                  TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                  RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

                  jq -n \
                      --arg run_url "$RUN_URL" \
                      --arg timestamp "$TIMESTAMP" \
                      '{
                        username: "Hermóðr 🌑",
                        embeds: [{
                          title: "❌ dievas-landing deploy failed",
                          color: 15158332,
                          fields: [
                            { name: "🔗 Run", value: "[View](\($run_url))" }
                          ],
                          footer: { text: "Dievas CI/CD • Cloudflare Workers" },
                          timestamp: $timestamp
                        }]
                      }' > payload.json

                  curl -s -o /dev/null -w "%{http_code}" \
                      -X POST "${{ secrets.DISCORD_HERMODR_WEBHOOK }}" \
                      -H "Content-Type: application/json" \
                      -d @payload.json
              continue-on-error: true
