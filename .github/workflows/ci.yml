name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_call:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    analyze-format-test:
        name: Analyze, Format & Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - name: Cache pub packages
              uses: actions/cache@v6
              with:
                  path: ~/.pub-cache
                  key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
                  restore-keys: ${{ runner.os }}-pub-

            - name: Activate melos
              run: dart pub global activate melos

            - name: Bootstrap workspace
              run: melos bootstrap

            - name: Check formatting
              run: melos run format:check

            - name: Run analyzer
              run: melos exec --concurrency=1 -- "dart analyze ."

            - name: Run tests
              run: melos run test

            # Analyze landing (outside melos workspace — needs its own pub get)
            - name: Get landing dependencies
              run: dart pub get
              working-directory: landing

            - name: Analyze landing
              run: dart analyze .
              working-directory: landing

    ci-passed:
        name: CI Passed
        needs: [analyze-format-test]
        if: always() && !cancelled()
        runs-on: ubuntu-latest
        steps:
            - name: Check result
              if: contains(needs.analyze-format-test.result, 'failure')
              run: exit 1
