name: dievas_example
description: >-
  Example usage of the Dievas design system: brand theme setup and component
  consumption. This is the reference app every consumer should study before
  wiring Dievas into their own Flutter app.
publish_to: none
resolution: workspace

environment:
    sdk: ">=3.11.4 <4.0.0"
    flutter: ">=3.22.0"

dependencies:
    dievas:
        path: ../
    dievas_tokens:
        path: ../../dievas_tokens
    google_fonts: ^9.0.0

dev_dependencies:
    flutter_test:
        sdk: flutter

flutter:
    uses-material-design: true
