name: dievas
description: "Dievas design system. A Flutter theme and component layer for building branded, token driven interfaces."
version: 1.0.2
repository: https://github.com/SerticodeInc/dievas
homepage: https://dievas.serticode.com
resolution: workspace
issue_tracker: https://github.com/SerticodeInc/dievas/issues
topics: [design-system, flutter, ui, theming]

environment:
    sdk: ">=3.11.4 <4.0.0"
    flutter: ">=3.22.0"

dependencies:
    flutter:
        sdk: flutter
    dievas_tokens: ^1.0.1
    equatable: ^3.0.0
    meta: ^1.19.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0

flutter:
    fonts:
        - family: MartianMono
          fonts:
              - asset: lib/assets/fonts/MartianMono-Light.ttf
                weight: 300
              - asset: lib/assets/fonts/MartianMono-Regular.ttf
                weight: 400
              - asset: lib/assets/fonts/MartianMono-Medium.ttf
                weight: 500
              - asset: lib/assets/fonts/MartianMono-SemiBold.ttf
                weight: 600
