name: Deploy — Landing

# Build the Jaspr static site and upload it to Cloudflare Workers.
# Manual fallback only. Cloudflare Git integration deploys master automatically.
# Required secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit),
# CLOUDFLARE_ACCOUNT_ID.

on:
    workflow_dispatch:
        inputs:
            reason:
                description: "Reason for manual deploy (optional)"
                required: false
                default: "Manual trigger"

concurrency:
    group: deploy-landing
    cancel-in-progress: true

jobs:
    deploy:
        name: Deploy to Cloudflare Workers
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7

            - uses: dart-lang/setup-dart@v1
              with:
                  sdk: "3.13.2"

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: landing/package-lock.json

            - name: Deploy landing
              run: npx wrangler@4 deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
